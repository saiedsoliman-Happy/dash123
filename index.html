function hubCards(list){const g={};list.forEach(a=>{const o=g[a[2]]||(g[a[2]]={n:0,w:0,z:{},v:{}});o.n++;if(a[8]>0)o.w++;o.z[a[4]]=(o.z[a[4]]||0)+1;o.v[a[3]]=(o.v[a[3]]||0)+1});
 const hs=Object.keys(g).sort((a,b)=>g[b].n-g[a].n||a.localeCompare(b));if(!hs.length)return"";
 return`<div class="hcs" style="margin-bottom:18px">${hs.map(h=>{const o=g[h],p=o.n?o.w/o.n:0,zs=Object.entries(o.z).sort((a,b)=>b[1]-a[1]),mz=zs[0][1];

function newView(){const snap=day(),has=!!snap.nw,all=(snap.nw||[]).filter(a=>sc.sel.has(a[2])),jd=nj.date||snap.d,list=all.filter(a=>a[7]==jd).sort((a,b)=>a[2].localeCompare(b[2])||a[1].localeCompare(b[1]));
 const out=list.filter(a=>a[8]>0).length,cnt=t=>list.filter(a=>a[3]==t).length,bh={};list.forEach(a=>{const o=bh[a[2]]||(bh[a[2]]={n:0,w:0});o.n++;if(a[8]>0)o.w++});
 const days=[];for(let i=0;i<8;i++){const d=new Date(new Date(snap.d+"T00:00:00Z")-i*864e5).toISOString().slice(0,10);days.push([d,all.filter(a=>a[7]==d).length])}
 const cols=[["n","Star",a=>a[1],0,a=>`<b>${a[1]}</b>`],["h","Hub",a=>a[2]],["z","Zone",a=>a[4]],["v","Vehicle",a=>a[3],0,a=>vIc(a[3])+" "+(a[3]=="Sedan"?"Car":a[3])],["c","Contractor",a=>a[5]],["p","Phone",a=>a[6],0,a=>`<span class="mut">${a[6]}</span>`],["st","Went out?",a=>a[8],1,a=>a[8]>0?`<span class="chip ok">Went out - ${f(a[8])} shipments</span>`:'<span class="chip bad">Did not go out</span>']];
 return(has?"":'<div class="note">This day was saved before the New stars list existed. Upload its Stars and Attempts files again to fill it.</div>')+`<div class="card"><div class="tools"><b>Joined on</b><button class="btn s" data-nd="-1">&larr;</button><input type="date" id="njd" value="${jd}"><button class="btn s" data-nd="1">&rarr;</button><button class="btn s" data-nd="0">Day shown (${snap.d})</button><span class="sub">Last days:</span>${days.map(d=>`<button class="btn s ${d[0]==jd?"on":""}" data-nj="${d[0]}">${d[0].slice(5)}<small style="margin-left:6px;opacity:.85">${d[1]}</small></button>`).join("")}</div></div>
 <div class="kpis">${kp("New stars joined",f(list.length),"joined on "+jd+" in your selected hubs","b","u")}${kp("Went out with shipments",f(out),list.length?Math.round(out/list.length*100)+"% of the new stars":"-","g","c")}${kp("Did not go out",f(list.length-out),"no shipments on "+snap.d,"r","x")}${kp("Cars / Motorbikes / Vans",cnt("Sedan")+" / "+cnt("Motorbike")+" / "+cnt("Van"),"by vehicle type","y","g")}</div>
 ${hubCards(list)}
 <div class="card"><div class="top"><h3 style="margin:0">New stars list - joined ${jd}</h3><button class="btn s p" id="dlnew">Download Excel</button></div>${list.length?tbl("nw",cols,list):'<div class="note">No stars joined on this date in the selected hubs. Try another date above.</div>'}<div class="note">"Went out" means the star had at least one shipment (delivery, pickup or return) on ${snap.d}, the day shown. Joined date comes from the Joined At column of the Stars file.</div></div>`}

// ---------- upload + calculation
const pad=n=>String(n).padStart(2,"0"),wait=()=>new Promise(r=>setTimeout(r,40));
function pdate(v){if(typeof v=="number"&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return d.y+"-"+pad(d.m)+"-"+pad(d.d)}const m=/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/.exec(String(v));if(m)return m[3]+"-"+pad(m[1])+"-"+pad(m[2]);const t=new Date(v);return isNaN(t)?null:t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function buildDay(att,names){const hd=att[0].map(x=>String(x).trim().toLowerCase()),I={id:hd.indexOf("star id"),wh:hd.indexOf("warehouse name"),ty:hd.indexOf("type"),st:hd.indexOf("state"),dt:hd.indexOf("attempt date"),tr:hd.indexOf("tracking id")};
 const need={id:"Star ID",wh:"Warehouse Name",ty:"Type",st:"State",dt:"Attempt Date"},miss=Object.keys(need).filter(k=>I[k]<0).map(k=>need[k]);if(miss.length)throw new Error("The Attempts file is missing these columns: "+miss.join(", "));
 const hubOf=new Map();STARS.m.forEach(s=>hubOf.set(s[0],s[2]));STARS.o.forEach(s=>hubOf.set(s[0],s[1]));
 const rec=new Map(),un=new Map(),dc={},trk=new Set();let n=0,noid=0,dups=0;
 for(let i=1;i<att.length;i++){const r=att[i];if(!r||!r.length)continue;const id=String(r[I.id]==null?"":r[I.id]).trim();if(!id){noid++;continue}n++;
  let h=hubOf.get(id),u=false;if(h===undefined){u=true;let w=un.get(id);if(!w){w={};un.set(id,w)}const wn=String(r[I.wh]||"Unknown");w[wn]=(w[wn]||0)+1}
  const t=String(r[I.ty]||"").toLowerCase(),s=String(r[I.st]||"");let c=rec.get(id);if(!c){c={d:0,k:0,r:0,s:0,f:0};rec.set(id,c)}
  if(t=="delivery")c.d++;else if(t=="pickup")c.k++;else if(t=="return")c.r++;if(s=="Succeeded")c.s++;else if(s=="Failed")c.f++;
  const dd=pdate(r[I.dt]);if(dd)dc[dd]=(dc[dd]||0)+1;if(I.tr>=0){const k=r[I.tr];if(trk.has(k))dups++;else trk.add(k)}}
 if(!n)throw new Error("No shipment rows were found in the Attempts file.");
 const hubs={};HUBS.forEach(h=>hubs[h]=[0,0,0,0,0,0,0]);STARS.m.forEach(s=>{if(hubs[s[2]])hubs[s[2]][1]++});
 let mine=0;const active=new Set();
 rec.forEach((c,id)=>{let h=hubOf.get(id);if(h===undefined){const w=un.get(id);h=Object.entries(w).sort((a,b)=>b[1]-a[1])[0][0]}if(!hubs[h])return;const a=hubs[h];a[0]++;a[2]+=c.d;a[3]+=c.k;a[4]+=c.r;a[5]+=c.s;a[6]+=c.f;mine+=c.d+c.k+c.r;active.add(id)});
 const abs=STARS.m.filter(s=>!active.has(s[0]));
 const ds=Object.keys(dc).sort(),top=Object.entries(dc).sort((a,b)=>b[1]-a[1])[0][0];
 const lo=new Date(new Date(top+"T00:00:00Z")-30*864e5).toISOString().slice(0,10),nw=STARS.m.filter(s=>s[6]&&s[6]>=lo&&s[6]<=top).map(s=>{const c=rec.get(s[0])||{d:0,k:0,r:0};return[s[0],s[1],s[2],s[3],s[7]||"Unknown",s[4],s[5],s[6],c.d+c.k+c.r,c.d,c.k]});
 return{d:top,nw,dates:ds,built:new Date().toLocaleString("en-GB"),at:names.at,st:names.st,n,m:mine,un:un.size,du:dups,noid,hubs,abs}}
function renderUp(msgTxt,err){const d=day()||SEED_DAY,c=t=>`<span>${t}</span>`;
 const chips=`<div class="chk">${c("Day shown: <b>"+d.d+"</b>")}${c("Attempts file: <b>"+d.at+"</b> ("+f(d.n)+" rows)")}${c("In your "+HUBS.length+" hubs: <b>"+f(d.m)+"</b> shipments")}${c("Stars list: <b>"+d.st+"</b> ("+f(STARS?STARS.m.length:0)+" stars in your hubs)")}${d.un?c(f(d.un)+" stars delivered but are not in the Stars file"):""}${d.du?c(f(d.du)+" duplicate tracking IDs"):""}${c(DB&&DBW?"Saved for everyone (shared)":"Saved on this device only")}${c(f(Object.keys(DAYS).length)+" days stored")}</div>`;
 $("#up").innerHTML=`<div class="card drop" id="dz"><div class="top"><div><b style="font-size:18px">Daily update</b><div class="sub">Drop the <b>Stars export</b> and the <b>Attempts export</b> here, or choose them. Each day is kept, so you can switch between today, yesterday and older days. The Stars file can be skipped if it did not change. A <b>Targets</b> Excel (Hub, Target, Standard) can be dropped here too.</div></div><span><label class="btn p" for="fi">Choose files</label></span></div><input id="fi" type="file" accept=".xlsx,.xls,.csv" multiple hidden>${msgTxt?`<div class="${err?"err":"ok2"}">${msgTxt}</div>`:""}${chips}</div>`}
async function handle(files){files=[...files];if(!files.length)return;if(!window.XLSX){renderUp("The Excel reader could not load. Check your internet connection and reload.",1);return}
 let att=null,stars=null,tgf=null,nm={at:"",st:""};
 try{for(const fl of files){renderUp("Reading "+fl.name+" ... a large file can take up to a minute, please wait.");await wait();const wb=XLSX.read(await fl.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});if(!rows.length)throw new Error(fl.name+" is empty.");const h=rows[0].map(x=>String(x).trim().toLowerCase());
   if(h.includes("tracking id")||(h.includes("star id")&&h.includes("attempt date"))){att=rows;nm.at=fl.name}
   else if(h.includes("star id")&&h.includes("full name")){const ix=n=>h.indexOf(n),a=ix("star id"),b=ix("full name"),c=ix("hub"),d=ix("vehicle type"),e=ix("contractor"),jn=ix("joined at"),zn=ix("star zone"),p=["star fawry id","phone","mobile","phone number"].map(ix).find(x=>x>=0);
    const m=[],o=[];rows.slice(1).forEach(r=>{if(!r[a])return;const id=String(r[a]).trim(),hb=c>=0?String(r[c]||"").trim():"";if(MINE.has(hb))m.push([id,String(r[b]||""),hb,d>=0?String(r[d]||"")||"Unknown":"Unknown",e>=0?String(r[e]||"")||"Unknown":"Unknown",p>=0?String(r[p]||"").replace(/\.0$/,""):"",jn>=0?(pdate(r[jn])||""):"",zn>=0?String(r[zn]||"")||"Unknown":"Unknown"]);else o.push([id,hb])});stars={m,o};nm.st=fl.name}
   else{const hn=h.findIndex(x=>x=="hub"||x=="hub name"),tn=h.findIndex(x=>x=="target"||x=="targets"||x=="target stars"),sn=h.findIndex(x=>["standard","standard avg","standard ofd","std","std avg"].includes(x));
    if(hn<0||(tn<0&&sn<0))throw new Error(fl.name+" is not recognized. The Stars file needs Star Id and Full Name, the Attempts file needs Tracking ID and Attempt Date, and a targets file needs Hub with Target and/or Standard columns.");
    tgf={tg:{},sd:{}};const hubFor=x=>{const t=String(x).trim().toLowerCase().replace(/\s*hub$/,"");return HUBS.find(q=>q.toLowerCase().replace(/\s*hub$/,"")==t)};rows.slice(1).forEach(r=>{const q=hubFor(r[hn]);if(!q)return;if(tn>=0&&!isNaN(parseFloat(r[tn])))tgf.tg[q]=parseFloat(r[tn]);if(sn>=0&&!isNaN(parseFloat(r[sn])))tgf.sd[q]=parseFloat(r[sn])})}}
  if(tgf){Object.assign(CFG.tg,tgf.tg);Object.assign(CFG.sd,tgf.sd);saveCfg()}
  if(stars){STARS=stars;await persistStars()}
  if(att){renderUp("Calculating ...");await wait();const dd=buildDay(att,{at:nm.at,st:nm.st||(day()&&day().st)||"previous list"});DAYS[dd.d]=dd;PERSIST.delete(dd.d);cur=dd.d;SENT[cur]=SENT[cur]||[];await persistAll();wa.sel.clear();wa.queue=[];render();renderUp("Done - "+dd.d+" is calculated and saved.")}
  else if(stars||tgf){render();renderUp(stars?"Stars list updated. Now drop the Attempts file.":"Targets and standards updated.")}
  else throw new Error("Please include the Attempts export.")}
 catch(e){renderUp(e.message||String(e),1)}}
$("#up").addEventListener("change",e=>{if(e.target.id=="fi"){handle(e.target.files);e.target.value=""}});
